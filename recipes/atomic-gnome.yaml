---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: atomic-gnome
description: Atomic OS - GNOME

base-image: ghcr.io/ublue-os/silverblue-main
image-version: 44
platforms:
  - linux/amd64

modules:
  - type: signing

  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - pre_install.sh

  - type: dnf
    install:
      allow-erasing: true
      packages:
        # base
        - "@virtualization"
        - adw-gtk3-theme
        - bat
        - bc
        - btop
        - cmatrix
        - curl
        - expect
        - eza
        - fastfetch
        - fd-find
        - fzf
        - gnome-boxes
        - htop
        - inxi
        - jq
        - langpacks-en
        - langpacks-pt
        - less
        - lm_sensors
        - lolcat
        - lsb_release
        - lshw
        - mc
        - micro
        - nano
        - ncdu
        - neovim
        - nvtop
        - onefetch
        - openssl
        - ripgrep
        - rsync
        - screen
        - tldr
        - tmux
        - tree
        - vim
        - wget
        - wl-clipboard
        - xclip
        - xsel
        - yq
        - zsh
        # network
        - bind-utils
        - firejail
        - firewall-config
        - iperf3
        - iw
        - mtr
        - net-tools
        - netcat
        - nmap
        - nss-tools
        - samba
        - speedtest-cli
        - sshuttle
        - tcpdump
        - telnet
        - traceroute
        - whois
        - wireguard-tools
        - wol
        # utils
        - alien
        - android-tools
        - binwalk
        - cups-pdf
        - freerdp
        - rpmrebuild
        - sqlite
        - stow
        # file system
        - bsdtar
        - btrbk
        - btrfs-assistant
        - duperemove
        - fuse-libs
        - fuse3-libs
        - gparted
        - p7zip
        - p7zip-plugins
        - parted
        - snapper
        - squashfs-tools
        - trash-cli
        - unar
        - unrar
        - unzip
        - zip
        - zstd
        # containers
        - bubblewrap
        - crun-krun
        - distrobox
        - docker
        - docker-compose
        - helm
        - kubernetes-client
        - podman
        - podman-compose
        - socat
        # vcs
        - git
        - git-delta
        - git-extras
        - git-filter-repo
        - git-lfs
        # development
        - autoconf
        - automake
        - bison
        - cmake
        - direnv
        - gcc
        - gcc-c++
        - just
        - m4
        - make
        - meson
        - ninja
        - patch
        - ShellCheck
        - shfmt
        - texinfo
        # apps
        - dconf-editor
        - ffmpegthumbnailer
        - file-roller
        - file-roller-nautilus
        - gnome-firmware
        - gnome-text-editor
        - gnome-tweaks
        - rclone
        - rclone-browser
        - seahorse
        - sushi
        - syncthing
        - tilix
        - tilix-nautilus
        # wifiman
        - libayatana-appindicator3
        - webkit2gtk4.1
    remove:
      packages:
        - gnome-software-fedora-langpacks
        - gnome-terminal
        - ptyxis

  - type: dnf
    repos:
      files:
        - terra.repo
    install:
      allow-erasing: true
      packages:
        # base
        - micro-default-editor
        - starship
        - topgrade
        # fonts
        - firacode-nerd-fonts
        - ms-core-fonts
        # vcs
        - git-credential-manager
        - lazygit
        # development
        - mise
        - zed
        - zed-cli

  - type: dnf
    repos:
      files:
        - 1password.repo
        - brave-browser.repo
        - google-chrome.repo
        - tailscale.repo
        - vscode.repo
    install:
      packages:
        - 1password
        - 1password-cli
        - brave-origin
        - code
        - google-chrome-stable
        - tailscale

  - type: script
    scripts:
      - post_install.sh

  - type: systemd
    system:
      enabled:
        - docker.service
        - docker.socket
        - libvirtd.service
        - podman-restart.service
        - podman.socket
        - sshd.service
        - tailscaled.service
    user:
      enabled:
        - podman-restart.service
        - podman.socket

  - type: gnome-extensions
    install:
      - 4338 # allowlockedremotedesktop@kamens.us
      - 4269 # AlphabeticalAppGrid@stuarthayhurst
      - 615 # appindicatorsupport@rgcjonas.gmail.com
      - 3193 # blur-my-shell@aunetx
      - 4679 # burn-my-windows@schneegans.github.com
      - 3740 # compiz-alike-magic-lamp-effect@hermes83.github.com
      - 3210 # compiz-windows-effect@hermes83.github.com
      - 1160 # dash-to-panel@jderose9.github.com
      - 2087 # ding@rastersoft.com
      - 7 # drive-menu@gnome-shell-extensions.gcampax.github.com
      - 5410 # grand-theft-focus@zalckos.github.com
      - 1218 # printers@linux-man.org
      - 5964 # quicksettings-audio-devices-hider@marcinjahn.com
      - 5470 # weatheroclock@CleoMenezesJr.github.io
  - type: script
    snippets:
      - chmod +x /usr/share/gnome-shell/extensions/ding@rastersoft.com/app/{ding,createThumbnail}.js

  - type: gschema-overrides

  - type: bling
    install:
      - dconf-update-service
